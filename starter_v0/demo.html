<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Agent — UI/UX Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --panel:#12151d;
    --panel-2:#171b26;
    --panel-3:#1d2230;
    --border:#242a3a;
    --border-soft:#1a1f2c;
    --text:#e7e9ef;
    --text-dim:#9199ac;
    --text-faint:#5b6377;
    --accent:#6c8eff;
    --accent-soft:#6c8eff22;
    --ok:#43d9b8;
    --ok-soft:#43d9b81a;
    --warn:#f0b04a;
    --warn-soft:#f0b04a1a;
    --err:#f16b81;
    --err-soft:#f16b811a;
    --radius:10px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, #1a2036 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}

  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    background:rgba(18,21,29,0.85);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:40;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--display);
    font-weight:700;
    font-size:15.5px;
    letter-spacing:0.2px;
    margin-right:4px;
  }
  .brand .mark{
    width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg,var(--accent),#9c7bff);
    display:flex;align-items:center;justify-content:center;
    font-size:12px; color:#0a0c11; font-weight:700;
    box-shadow:0 0 0 1px #ffffff22 inset;
  }
  .demo-badge{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--warn);
    background:var(--warn-soft);
    border:1px solid #f0b04a3d;
    padding:3px 8px;
    border-radius:100px;
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  .select-wrap{position:relative;}
  select.ver-select{
    appearance:none;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--mono);
    font-size:12.5px;
    padding:7px 28px 7px 12px;
    border-radius:8px;
    cursor:pointer;
    outline:none;
  }
  select.ver-select:focus-visible{ box-shadow:0 0 0 2px var(--accent-soft); border-color:var(--accent); }
  .select-wrap::after{
    content:"⌄";
    position:absolute; right:10px; top:50%; transform:translateY(-55%);
    color:var(--text-faint); pointer-events:none; font-size:13px;
  }
  .status-pill{
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border);
    padding:6px 11px; border-radius:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft);}
  .dot.warn{background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft);}
  .dot.err{background:var(--err); box-shadow:0 0 0 3px var(--err-soft);}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex; gap:2px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    overflow-x:auto;
  }
  .tab-btn{
    font-family:var(--body);
    font-weight:500;
    font-size:13.5px;
    color:var(--text-dim);
    background:transparent;
    border:none;
    padding:12px 16px 11px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--accent);}
  .tab-btn .count{
    font-family:var(--mono); font-size:10.5px; color:var(--text-faint);
    background:var(--panel-3); padding:1px 6px; border-radius:100px; margin-left:6px;
  }

  main{flex:1; display:flex; min-height:0;}
  .view{display:none; flex:1; min-height:0;}
  .view.active{display:flex;}

  /* ---------- CHAT VIEW ---------- */
  .chat-view{width:100%; max-width:920px; margin:0 auto; display:flex; flex-direction:column; padding:0 20px;}
  .scenario-row{
    display:flex; gap:8px; flex-wrap:wrap;
    padding:16px 0 10px;
  }
  .scenario-btn{
    font-family:var(--body); font-size:12.5px; font-weight:500;
    color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border);
    padding:8px 13px; border-radius:100px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .scenario-btn:hover{color:var(--text); border-color:#3a4257;}
  .scenario-btn:disabled{opacity:.4; cursor:not-allowed;}

  .chat-stream{
    flex:1; overflow-y:auto; padding:8px 0 20px;
    display:flex; flex-direction:column; gap:14px;
  }
  .msg-row{display:flex; gap:10px; max-width:100%;}
  .msg-row.user{justify-content:flex-end;}
  .avatar{
    width:26px; height:26px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; font-family:var(--display);
    margin-top:2px;
  }
  .avatar.agent{background:linear-gradient(135deg,var(--accent),#9c7bff); color:#0a0c11;}
  .avatar.user{background:var(--panel-3); color:var(--text-dim); border:1px solid var(--border);}
  .bubble{
    max-width:min(640px,80%);
    padding:11px 14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.55;
  }
  .msg-row.agent .bubble{background:var(--panel-2); border:1px solid var(--border); border-top-left-radius:4px;}
  .msg-row.user .bubble{background:var(--accent); color:#0a0c11; border-top-right-radius:4px; font-weight:500;}

  .tool-card{
    max-width:640px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    font-size:12.5px;
    margin-left:36px;
  }
  .tool-card-head{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .tool-name{font-family:var(--mono); font-weight:600; font-size:12.5px;}
  .badge{
    font-family:var(--mono); font-size:10px; letter-spacing:.03em;
    padding:2px 7px; border-radius:100px; font-weight:600;
  }
  .badge.running{color:var(--warn); background:var(--warn-soft);}
  .badge.success{color:var(--ok); background:var(--ok-soft);}
  .badge.error{color:var(--err); background:var(--err-soft);}
  .badge.waiting{color:var(--text-dim); background:var(--panel-3);}
  .tool-meta{color:var(--text-faint); font-family:var(--mono); font-size:11px; margin-left:auto;}
  .tool-sub{color:var(--text-dim); margin:4px 0 6px;}

  details.mini{margin-top:6px;}
  details.mini summary{
    cursor:pointer; color:var(--text-dim); font-family:var(--mono); font-size:11px;
    list-style:none; display:flex; align-items:center; gap:5px;
  }
  details.mini summary::before{content:"▸"; font-size:9px; transition:transform .12s;}
  details.mini[open] summary::before{transform:rotate(90deg);}
  details.mini summary::-webkit-details-marker{display:none;}
  pre.code{
    margin:7px 0 0; padding:9px 11px;
    background:#0b0d13; border:1px solid var(--border-soft); border-radius:7px;
    font-family:var(--mono); font-size:11.5px; color:#b9c4dd;
    overflow-x:auto; white-space:pre;
  }

  .confirm-box{
    max-width:420px; margin-left:36px;
    background:var(--warn-soft); border:1px solid #f0b04a40;
    border-radius:10px; padding:12px 13px; font-size:13px;
  }
  .confirm-actions{display:flex; gap:8px; margin-top:10px;}
  .btn{
    font-family:var(--body); font-size:12.5px; font-weight:600;
    padding:7px 14px; border-radius:7px; cursor:pointer; border:1px solid transparent;
  }
  .btn.primary{background:var(--accent); color:#0a0c11;}
  .btn.ghost{background:transparent; border-color:var(--border); color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text); border-color:#3a4257;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .error-card{
    max-width:520px; margin-left:36px;
    background:var(--err-soft); border:1px solid #f16b8140;
    border-radius:10px; padding:12px 13px; font-size:13px;
  }
  .error-title{display:flex; align-items:center; gap:7px; font-weight:600; color:var(--err); margin-bottom:3px;}

  .typing{display:flex; gap:4px; padding:4px 2px;}
  .typing span{width:5px;height:5px;border-radius:50%;background:var(--text-faint); animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .composer{
    border-top:1px solid var(--border);
    padding:12px 0 18px;
    display:flex; gap:8px; align-items:flex-end;
  }
  .composer textarea{
    flex:1; resize:none;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 13px; font-family:var(--body); font-size:14px;
    outline:none; min-height:44px; max-height:120px;
  }
  .composer textarea:focus{border-color:var(--accent);}
  .composer textarea:disabled{opacity:.5;}
  .send-btn{
    width:44px; height:44px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#0a0c11; font-size:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .send-btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- TOOL TRACE VIEW ---------- */
  .trace-view{width:100%; max-width:820px; margin:0 auto; padding:20px; overflow-y:auto;}
  .trace-header{margin-bottom:18px;}
  .trace-header h2{font-family:var(--display); font-size:18px; margin:0 0 4px;}
  .trace-header p{color:var(--text-dim); font-size:13px; margin:0;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state .glyph{font-size:26px; margin-bottom:10px; opacity:.5;}

  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:""; position:absolute; left:9px; top:6px; bottom:6px; width:1px; background:var(--border);
  }
  .t-item{position:relative; margin-bottom:16px;}
  .t-dot{
    position:absolute; left:-26px; top:14px; width:19px; height:19px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:9px;
  }
  .t-dot.success{border-color:var(--ok); color:var(--ok);}
  .t-dot.error{border-color:var(--err); color:var(--err);}
  .t-dot.waiting{border-color:var(--warn); color:var(--warn);}
  .t-card{
    background:var(--panel-2); border:1px solid var(--border); border-radius:11px; padding:14px 16px;
  }
  .t-card-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .t-round{font-family:var(--mono); font-size:11px; color:var(--text-faint); border:1px solid var(--border); padding:2px 7px; border-radius:100px;}
  .t-toolname{font-family:var(--mono); font-weight:600; font-size:14px;}
  .t-duration{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
  .t-desc{color:var(--text-dim); font-size:12.5px; margin:7px 0 2px;}

  /* ---------- RUN DETAILS VIEW ---------- */
  .run-view{width:100%; max-width:760px; margin:0 auto; padding:20px; overflow-y:auto;}
  .kv-panel{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:16px;}
  .kv-panel h3{
    font-family:var(--display); font-size:13px; margin:0; padding:12px 16px;
    border-bottom:1px solid var(--border); color:var(--text-dim); font-weight:600;
    letter-spacing:.02em; text-transform:uppercase; font-size:11.5px;
  }
  .kv-row{display:flex; padding:10px 16px; border-bottom:1px solid var(--border-soft); font-size:13px; gap:14px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-key{color:var(--text-faint); font-family:var(--mono); font-size:12px; width:180px; flex-shrink:0;}
  .kv-val{font-family:var(--mono); font-size:12.5px; color:var(--text); word-break:break-all;}
  .kv-val.hash{color:#9db4ff;}
  .copy-hint{color:var(--text-faint); font-size:11px; margin-top:-6px; margin-bottom:16px;}

  /* ---------- METRICS VIEW ---------- */
  .metrics-view{width:100%; max-width:900px; margin:0 auto; padding:20px; overflow-y:auto;}
  table.metrics{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:22px;}
  table.metrics th{
    text-align:left; font-family:var(--mono); font-size:11px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  table.metrics td{padding:10px; border-bottom:1px solid var(--border-soft); font-family:var(--mono); font-size:12.5px;}
  table.metrics tr:hover td{background:var(--panel-2);}
  .bar-cell{display:flex; align-items:center; gap:8px;}
  .bar-track{flex:1; height:6px; background:var(--panel-3); border-radius:100px; overflow:hidden; min-width:60px;}
  .bar-fill{height:100%; border-radius:100px; background:var(--accent);}
  .ver-tag{
    font-family:var(--mono); font-weight:600; font-size:12px;
    padding:2px 8px; border-radius:6px; background:var(--panel-3); color:var(--text);
  }
  .flag{color:var(--warn); font-size:11px;}
  .note-box{
    font-size:12.5px; color:var(--text-dim); background:var(--panel-2);
    border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:4px;
  }

  @media (max-width:640px){
    header{padding:10px 14px;}
    .header-controls{width:100%; justify-content:space-between;}
    .chat-view, .trace-view, .run-view, .metrics-view{padding:0 12px;}
    .bubble, .tool-card, .confirm-box, .error-card{max-width:100%;}
    .kv-key{width:130px;}
    table.metrics{font-size:11.5px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="mark">R</span> Research Agent</div>
    <span class="demo-badge">DEMO · dữ liệu minh hoạ</span>
    <div class="header-controls">
      <div class="status-pill"><span class="dot" id="providerDot"></span><span id="providerLabel">gemini · gemini-3.5-flash</span></div>
      <div class="select-wrap">
        <select class="ver-select" id="versionSelect" onchange="onVersionChange()">
          <option value="v0">Version: v0</option>
          <option value="v1">Version: v1</option>
          <option value="v2">Version: v2</option>
          <option value="v3" selected>Version: v3</option>
        </select>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">Chat</button>
    <button class="tab-btn" data-tab="trace" onclick="switchTab('trace')">Tool Trace <span class="count" id="traceCount">0</span></button>
    <button class="tab-btn" data-tab="run" onclick="switchTab('run')">Run Details</button>
    <button class="tab-btn" data-tab="metrics" onclick="switchTab('metrics')">Metrics</button>
  </nav>

  <main>
    <!-- CHAT VIEW -->
    <section class="view active" id="view-chat">
      <div class="chat-view">
        <div class="scenario-row">
          <button class="scenario-btn" onclick="runScenario('normal')">🔍 Tin AI hôm nay</button>
          <button class="scenario-btn" onclick="runScenario('missing')">❓ Tóm tắt bài viết này giúp mình</button>
          <button class="scenario-btn" onclick="runScenario('confirm')">📤 Gửi bản tổng hợp lên Telegram</button>
          <button class="scenario-btn" onclick="runScenario('error')">⚠️ Trigger lỗi tool (demo)</button>
          <button class="scenario-btn" onclick="resetChat()">↺ Reset hội thoại</button>
        </div>
        <div class="chat-stream" id="chatStream"></div>
        <div class="composer">
          <textarea id="composerInput" placeholder="Nhập câu hỏi, hoặc bấm một gợi ý ở trên…" rows="1" onkeydown="handleComposerKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendFromComposer()">↑</button>
        </div>
      </div>
    </section>

    <!-- TOOL TRACE VIEW -->
    <section class="view" id="view-trace">
      <div class="trace-view">
        <div class="trace-header">
          <h2>Tool Trace</h2>
          <p>Chi tiết round-by-round của lượt chạy gần nhất — mỗi tool call gồm args, kết quả, thời lượng và trạng thái.</p>
        </div>
        <div id="traceContent">
          <div class="empty-state">
            <div class="glyph">⎋</div>
            Chưa có tool call nào. Chạy một scenario ở tab Chat để xem trace tại đây.
          </div>
        </div>
      </div>
    </section>

    <!-- RUN DETAILS VIEW -->
    <section class="view" id="view-run">
      <div class="run-view" id="runContent"></div>
    </section>

    <!-- METRICS VIEW -->
    <section class="view" id="view-metrics">
      <div class="metrics-view" id="metricsContent"></div>
    </section>
  </main>
</div>

<script>
/* ============================================================

  { v: "v1", case: 0.75, routing: 0.90, args: 0.80, multiturn: 1.00, errors: 0, note: "Đổi model + thêm backoff → hết provider_error. Sửa mô tả tool lookup (tách topic khỏi query)." },
  { v: "v2", case: 0.85, routing: 0.95, args: 0.85, multiturn: 0.83, errors: 0, note: "Thêm boundary rõ cho clarify khi thiếu URL/handle trong system_prompt." },
  { v: "v3", case: 0.95, routing: 1.00, args: 0.95, multiturn: 1.00, errors: 0, note: "Tinh chỉnh confirmation boundary cho action tool (Telegram send)." }
];

// Whether v0 gets the "missing info" scenario wrong (demonstrates the real R11 bug)
function versionHandlesClarifyCorrectly(v){ return v !== "v0"; }

let state = { messages: [], trace: [], round: 0, busy: false };

/* ---------------- TAB SWITCHING ---------------- */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='run') renderRunDetails();
  if(tab==='metrics') renderMetrics();
}

/* ---------------- VERSION SELECT ---------------- */
function onVersionChange(){
  const v = document.getElementById('versionSelect').value;
  const dot = document.getElementById('providerDot');
  const label = document.getElementById('providerLabel');
  const meta = RUN_META[v];
  label.textContent = `${meta.provider} · ${meta.model}`;
  dot.className = 'dot' + (v==='v0' ? ' err' : '');
  if(v==='v0'){ label.textContent += ' · rate limited'; }
  renderRunDetails();
  renderMetrics();
}

/* ---------------- CHAT HELPERS ---------------- */
const stream = document.getElementById('chatStream');
function scrollBottom(){ stream.scrollTop = stream.scrollHeight; }

function addUserMsg(text){
  const row = document.createElement('div');
  row.className='msg-row user';
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="avatar user">U</div>`;
  stream.appendChild(row); scrollBottom();
}
function addAgentMsg(text){
  const row = document.createElement('div');
  row.className='msg-row agent';
  row.innerHTML = `<div class="avatar agent">A</div><div class="bubble">${text}</div>`;
  stream.appendChild(row); scrollBottom();
}
function addTyping(){
  const row = document.createElement('div');
  row.className='msg-row agent'; row.id='typingRow';
  row.innerHTML = `<div class="avatar agent">A</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  stream.appendChild(row); scrollBottom();
}
function removeTyping(){ const r=document.getElementById('typingRow'); if(r) r.remove(); }

function addToolCard(tool, args, status, resultText, duration){
  const row = document.createElement('div');
  row.className='msg-row agent';
  const id = 'tool-'+Math.random().toString(36).slice(2,8);
  row.innerHTML = `
    <div style="width:26px;flex-shrink:0;"></div>
    <div class="tool-card" id="${id}">
      <div class="tool-card-head">
        <span class="tool-name">${tool}</span>
        <span class="badge running" data-role="badge">running</span>
        <span class="tool-meta" data-role="meta">round ${state.round}</span>
      </div>
      <details class="mini" open><summary>arguments</summary>
        <pre class="code">${escapeHtml(JSON.stringify(args, null, 2))}</pre>
      </details>
      <details class="mini" data-role="result-wrap"><summary>result</summary>
        <pre class="code" data-role="result"></pre>
      </details>
    </div>`;
  stream.appendChild(row); scrollBottom();
  return id;
}
function resolveToolCard(id, status, resultText, duration){
  const card = document.getElementById(id);
  if(!card) return;
  const badge = card.querySelector('[data-role="badge"]');
  badge.className = 'badge ' + status;
  badge.textContent = status;
  card.querySelector('[data-role="meta"]').textContent = `round ${state.round} · ${duration}`;
  card.querySelector('[data-role="result"]').textContent = resultText;
}

function addConfirmBox(question, onConfirm){
  const row = document.createElement('div');
  row.className='msg-row agent';
  const id = 'confirm-'+Math.random().toString(36).slice(2,8);
  row.innerHTML = `
    <div style="width:26px;flex-shrink:0;"></div>
    <div class="confirm-box" id="${id}">
      <div style="font-weight:600; margin-bottom:2px;">⚠️ Cần xác nhận</div>
      <div style="color:var(--text-dim);">${question}</div>
      <div class="confirm-actions">
        <button class="btn primary" data-role="confirm">Xác nhận</button>
        <button class="btn ghost" data-role="cancel">Hủy</button>
      </div>
    </div>`;
  stream.appendChild(row); scrollBottom();
  const box = document.getElementById(id);
  box.querySelector('[data-role="confirm"]').onclick = ()=>{
    box.querySelectorAll('button').forEach(b=>b.disabled=true);
    box.querySelector('[data-role="confirm"]').textContent = 'Đã xác nhận ✓';
    onConfirm();
  };
  box.querySelector('[data-role="cancel"]').onclick = ()=>{
    box.querySelectorAll('button').forEach(b=>b.disabled=true);
    addAgentMsg('Đã hủy. Mình sẽ không gửi nội dung này.');
  };
}

function addErrorCard(title, detail, onRetry){
  const row = document.createElement('div');
  row.className='msg-row agent';
  const id = 'err-'+Math.random().toString(36).slice(2,8);
  row.innerHTML = `
    <div style="width:26px;flex-shrink:0;"></div>
    <div class="error-card" id="${id}">
      <div class="error-title">✕ ${title}</div>
      <div style="color:var(--text-dim); margin-bottom:8px;">${detail}</div>
      <details class="mini"><summary>Technical details</summary>
        <pre class="code">RuntimeError: Missing TAVILY_API_KEY env var
  at tools/lookup/tool.py:42
  provider=gemini · model=gemini-3.5-flash · round=${state.round}</pre>
      </details>
      <div class="confirm-actions">
        <button class="btn primary" data-role="retry">Thử lại</button>
      </div>
    </div>`;
  stream.appendChild(row); scrollBottom();
  document.getElementById(id).querySelector('[data-role="retry"]').onclick = onRetry;
}

function setBusy(b){
  state.busy = b;
  document.getElementById('sendBtn').disabled = b;
  document.getElementById('composerInput').disabled = b;
  document.querySelectorAll('.scenario-btn').forEach(btn=>btn.disabled=b);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- TRACE STATE ---------------- */
function pushTrace(entry){
  state.trace.push(entry);
  document.getElementById('traceCount').textContent = state.trace.length;
}
function resetTrace(){
  state.trace = [];
  state.round = 0;
  document.getElementById('traceCount').textContent = 0;
  document.getElementById('traceContent').innerHTML = `<div class="empty-state"><div class="glyph">⎋</div>Chưa có tool call nào. Chạy một scenario ở tab Chat để xem trace tại đây.</div>`;
}
function renderTraceView(){
  const el = document.getElementById('traceContent');
  if(state.trace.length===0){ resetTrace(); return; }
  el.innerHTML = `<div class="timeline">` + state.trace.map(t=>`
    <div class="t-item">
      <div class="t-dot ${t.status}">${t.status==='success'?'✓':t.status==='error'?'✕':'…'}</div>
      <div class="t-card">
        <div class="t-card-top">
          <span class="t-round">round ${t.round}</span>
          <span class="t-toolname">${t.tool}</span>
          <span class="badge ${t.status}">${t.status}</span>
          <span class="t-duration">${t.duration||''}</span>
        </div>
        <div class="t-desc">${t.desc||''}</div>
        <details class="mini"><summary>arguments</summary><pre class="code">${escapeHtml(JSON.stringify(t.args,null,2))}</pre></details>
        <details class="mini"><summary>result</summary><pre class="code">${escapeHtml(t.result||'')}</pre></details>
      </div>
    </div>
  `).join('') + `</div>`;
}

/* ---------------- SCENARIOS ---------------- */
function handleComposerKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendFromComposer(); }
}
function sendFromComposer(){
  const inp = document.getElementById('composerInput');
  const text = inp.value.trim();
  if(!text || state.busy) return;
  inp.value = '';
  addUserMsg(text);
  const t = text.toLowerCase();
  setBusy(true);
  addTyping();
  setTimeout(()=>{
    removeTyping();
    if(t.includes('telegram') || t.includes('gửi')) return void runTelegramFlow();
    if(t.includes('tóm tắt') && !t.includes('http')) return void runMissingInfoFlow();
    if(t.includes('lỗi') || t.includes('error')) return void runErrorFlow();
    if(t.includes('http')) return void runFetchOk(text);
    runNormalFlow(text);
  }, 700);
}

function runScenario(kind){
  if(state.busy) return;
  const map = {
    normal: "Tìm tin AI hôm nay và tóm tắt 5 ý chính.",
    missing: "Tóm tắt bài viết này giúp mình.",
    confirm: "Gửi bản tổng hợp này lên Telegram giúp mình.",
    error: "Tìm tin tức mới nhất về chính sách xuất khẩu chip AI."
  };
  addUserMsg(map[kind]);
  setBusy(true);
  addTyping();
  setTimeout(()=>{
    removeTyping();
    if(kind==='normal') runNormalFlow(map[kind]);
    if(kind==='missing') runMissingInfoFlow();
    if(kind==='confirm') runTelegramFlow();
    if(kind==='error') runErrorFlow();
  }, 700);
}

function resetChat(){
  stream.innerHTML = '';
  resetTrace();
  setBusy(false);
}

/* Normal flow: lookup succeeds */
function runNormalFlow(query){
  state.round += 1;
  const id = addToolCard('lookup', {query:"AI", topic:"news", timeframe:"day"}, 'running');
  setTimeout(()=>{
    resolveToolCard(id, 'success', "5 items returned\n1. \"OpenAI công bố...\"\n2. \"Anthropic ra mắt...\"\n3. ...", "1.8s");
    pushTrace({round:state.round, tool:'lookup', status:'success', duration:'1.8s', args:{query:"AI", topic:"news", timeframe:"day"}, result:"5 items returned", desc:'Tìm tin tức AI trong ngày qua web_search.'});
    renderTraceView();
    setTimeout(()=>{
      addAgentMsg("Đây là 5 tin AI nổi bật hôm nay:<br><br>1. OpenAI công bố cập nhật mô hình mới.<br>2. Anthropic mở rộng quyền truy cập Claude.<br>3. EU thảo luận thêm về đạo luật AI.<br>4. Một startup robotics gọi vốn vòng Series B.<br>5. Nghiên cứu mới về AI alignment được công bố.");
      setBusy(false);
    }, 500);
  }, 900);
}

/* Missing info flow: depends on version */
function runMissingInfoFlow(){
  const v = document.getElementById('versionSelect').value;
  state.round += 1;
  if(versionHandlesClarifyCorrectly(v)){
    const id = addToolCard('clarify', {response_type:"text"}, 'running');
    setTimeout(()=>{
      resolveToolCard(id, 'success', "awaiting user input", "0.4s");
      pushTrace({round:state.round, tool:'clarify', status:'success', duration:'0.4s', args:{response_type:"text"}, result:"awaiting user input", desc:'Không có URL trong yêu cầu → hỏi lại thay vì đoán bừa.'});
      renderTraceView();
      setTimeout(()=>{
        addAgentMsg("Bạn vui lòng cung cấp URL của bài viết cần tóm tắt nhé.");
        setBusy(false);
        document.getElementById('composerInput').placeholder = "Dán URL bài viết vào đây…";
      }, 400);
    }, 700);
  } else {
    const id = addToolCard('lookup', {topic:"news", timeframe:"week", query:"tin tức công nghệ AI mới nhất"}, 'running');
    setTimeout(()=>{
      resolveToolCard(id, 'error', "RuntimeError: Missing TAVILY_API_KEY env var", "0.6s");
      pushTrace({round:state.round, tool:'lookup', status:'error', duration:'0.6s', args:{topic:"news", timeframe:"week", query:"tin tức công nghệ AI mới nhất"}, result:"Missing TAVILY_API_KEY env var", desc:'⚠ v0: agent tự suy diễn và gọi lookup thay vì hỏi lại URL — đây chính là bug thật trong run v0 (case R11).'});
      renderTraceView();
      setTimeout(()=>{
        addAgentMsg("Mình đã tìm vài tin công nghệ AI gần đây, nhưng có vẻ chưa đúng ý — <span style='color:var(--warn)'>bạn có thể cho mình xin URL bài viết cụ thể không?</span><br><br><span style='color:var(--text-faint);font-size:12px'>⚠ v0 đang thiếu boundary: lẽ ra phải gọi <code>clarify</code> ngay từ đầu. Thử lại với v1–v3 để thấy khác biệt.</span>");
        setBusy(false);
      }, 500);
    }, 900);
  }
}

/* URL follow-up after clarify */
function runFetchOk(url){
  state.round += 1;
  const id = addToolCard('fetch', {url:url}, 'running');
  setTimeout(()=>{
    resolveToolCard(id, 'success', "Đã trích được ~1,200 từ nội dung trang.", "1.1s");
    pushTrace({round:state.round, tool:'fetch', status:'success', duration:'1.1s', args:{url:url}, result:"Đã trích được ~1,200 từ nội dung trang.", desc:'Đọc nội dung URL người dùng vừa cung cấp.'});
    renderTraceView();
    setTimeout(()=>{
      addAgentMsg("Đây là tóm tắt bài viết: nội dung chính xoay quanh hướng phát triển sản phẩm mới, kèm vài số liệu minh hoạ và trích dẫn từ đội ngũ phát triển.");
      setBusy(false);
      document.getElementById('composerInput').placeholder = "Nhập câu hỏi, hoặc bấm một gợi ý ở trên…";
    }, 500);
  }, 900);
}

/* Confirmation boundary flow */
function runTelegramFlow(){
  state.round += 1;
  const id = addToolCard('clarify', {response_type:"yes_no"}, 'running');
  setTimeout(()=>{
    resolveToolCard(id, 'success', "awaiting confirmation", "0.3s");
    pushTrace({round:state.round, tool:'clarify', status:'success', duration:'0.3s', args:{response_type:"yes_no"}, result:"awaiting confirmation", desc:'Hành động ghi (gửi Telegram) → xác nhận trước khi thực thi.'});
    renderTraceView();
    setTimeout(()=>{
      addConfirmBox("Bạn có chắc chắn muốn gửi bản tổng hợp này lên kênh Telegram không?", ()=>{
        state.round += 1;
        const sendId = addToolCard('send', {channel:"telegram", content:"[bản tổng hợp 5 ý chính]"}, 'running');
        setTimeout(()=>{
          resolveToolCard(sendId, 'success', "message_id: 4821 · delivered", "0.9s");
          pushTrace({round:state.round, tool:'send', status:'success', duration:'0.9s', args:{channel:"telegram", content:"[bản tổng hợp 5 ý chính]"}, result:"message_id: 4821 · delivered", desc:'Gửi sau khi người dùng xác nhận. (Live-send là optional — đây là mock cho demo.)'});
          renderTraceView();
          addAgentMsg("Đã gửi bản tổng hợp lên Telegram ✓");
          setBusy(false);
        }, 900);
      });
      setBusy(false);
    }, 400);
  }, 700);
}

/* Error / recovery flow */
function runErrorFlow(){
  state.round += 1;
  const id = addToolCard('lookup', {query:"chip export policy", topic:"news", timeframe:"day"}, 'running');
  setTimeout(()=>{
    resolveToolCard(id, 'error', "RuntimeError: Missing TAVILY_API_KEY env var", "0.5s");
    pushTrace({round:state.round, tool:'lookup', status:'error', duration:'0.5s', args:{query:"chip export policy", topic:"news", timeframe:"day"}, result:"Missing TAVILY_API_KEY env var", desc:'Tool lỗi do thiếu cấu hình API key.'});
    renderTraceView();
    addErrorCard(
      "Không thể hoàn thành tìm kiếm",
      "Tavily API chưa được cấu hình. Vui lòng thiết lập key trong <code>.env</code>.",
      ()=>{
        state.round += 1;
        const retryId = addToolCard('lookup', {query:"chip export policy", topic:"news", timeframe:"day"}, 'running');
        setTimeout(()=>{
          resolveToolCard(retryId, 'success', "4 items returned", "1.6s");
          pushTrace({round:state.round, tool:'lookup', status:'success', duration:'1.6s', args:{query:"chip export policy", topic:"news", timeframe:"day"}, result:"4 items returned", desc:'Retry sau khi key được cấu hình lại — phục hồi thành công, không mất lịch sử chat.'});
          renderTraceView();
          addAgentMsg("Đã tìm thấy 4 tin liên quan đến chính sách xuất khẩu chip AI. Bạn có muốn mình tóm tắt không?");
          setBusy(false);
        }, 900);
      }
    );
    setBusy(false);
  }, 800);
}

/* ---------------- RUN DETAILS ---------------- */

  const v = document.getElementById('versionSelect').value;
  const m = RUN_META[v];
  document.getElementById('runContent').innerHTML = `
    <div class="kv-panel">
      <h3>Run identity</h3>
      <div class="kv-row"><div class="kv-key">version</div><div class="kv-val"><span class="ver-tag">${v}</span></div></div>
      <div class="kv-row"><div class="kv-key">run_id</div><div class="kv-val">${m.runId}</div></div>
      <div class="kv-row"><div class="kv-key">artifact_version</div><div class="kv-val hash">${m.artifact}</div></div>
      <div class="kv-row"><div class="kv-key">prompt_hash</div><div class="kv-val hash">${m.promptHash}</div></div>
      <div class="kv-row"><div class="kv-key">tools_hash</div><div class="kv-val hash">${m.toolsHash}</div></div>
      <div class="kv-row"><div class="kv-key">generated_at</div><div class="kv-val">${m.generatedAt}</div></div>
    </div>
    <div class="kv-panel">
      <h3>Provider / Model</h3>
      <div class="kv-row"><div class="kv-key">provider</div><div class="kv-val">${m.provider}</div></div>
      <div class="kv-row"><div class="kv-key">model</div><div class="kv-val">${m.model}</div></div>
      <div class="kv-row"><div class="kv-key">phase / suite</div><div class="kv-val">B / base</div></div>
    </div>
    <div class="kv-panel">
      <h3>Transcript</h3>
      <div class="kv-row"><div class="kv-key">file</div><div class="kv-val">transcripts/${v}_chat_${m.generatedAt.replace(/[-:T]/g,'').slice(0,14)}.transcript.json</div></div>
    </div>
    <p class="copy-hint">Các giá trị trên là mock cho mục đích demo UI — khi nối backend thật, panel này đọc trực tiếp từ file run JSON tương ứng.</p>
  `;
}

/* ---------------- METRICS ---------------- */
function renderMetrics(){
  const current = document.getElementById('versionSelect').value;
  const rows = METRICS.map(m=>{
    const active = m.v===current ? 'style="background:var(--panel-2)"' : '';
    return `
    <tr ${active}>
      <td><span class="ver-tag">${m.v}</span></td>
      <td>${bar(m.case)}</td>
      <td>${bar(m.routing)}</td>
      <td>${bar(m.args)}</td>
      <td>${bar(m.multiturn)}</td>
      <td>${m.errors>0 ? `<span class="flag">${m.errors} ⚠</span>` : '0'}</td>
    </tr>`;
  }).join('');
  function bar(val){
    const pct = Math.round(val*100);
    return `<div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
  }
  const noteRow = METRICS.find(m=>m.v===current);
  document.getElementById('metricsContent').innerHTML = `
    <table class="metrics">
      <thead><tr>
        <th>Version</th><th>Case accuracy</th><th>Tool routing</th><th>Argument accuracy</th><th>Multiturn</th><th>Provider errors</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="note-box"><strong>${current}</strong> — ${noteRow.note}</div>
  `;
}

/* ---------------- INIT ---------------- */
onVersionChange();
resetTrace();
addAgentMsg("Chào bạn 👋 Mình là research agent. Bấm một trong các gợi ý ở trên hoặc gõ câu hỏi để bắt đầu demo.");
</script>
