# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi còn thiếu thông tin bắt buộc, hoặc khi cần xác nhận trước một hành động có tác động ra ngoài."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cho người dùng, viết bằng tiếng Việt"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "yes_no khi xin xác nhận trước một hành động (gửi, đăng, publish). text khi cần người dùng bổ sung thông tin còn thiếu. choice khi đưa sẵn danh sách lựa chọn"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây CỦA MỘT tài khoản Twitter/X cụ thể."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle Twitter/X của tài khoản, KHÔNG có @ và KHÔNG phải tên hiển thị. Phải quy đổi tên người thành handle thật, ví dụ Sam Altman → sama. Nếu request không nêu rõ tài khoản nào thì đừng đoán, hãy hỏi lại"}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy; lấy đúng con số người dùng nêu"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên Twitter/X THEO CHỦ ĐỀ, không giới hạn ở một tài khoản nào."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề. Không thêm các từ mô tả cách tìm như tweet, twitter, mới nhất"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi người dùng muốn bài phổ biến/nổi bật/nhiều tương tác nhất. Latest khi muốn bài mới nhất"}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy; lấy đúng con số người dùng nêu"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web/báo chí. Dùng khi người dùng chưa đưa link cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "CHỈ từ khóa chủ đề. Không lặp lại những gì đã được biểu diễn bằng tham số khác: bỏ 'tin tức'/'news' vì đã có topic, bỏ 'hôm nay'/'tuần này' vì đã có timeframe. Ví dụ 'Tin tức AI hôm nay' → query='AI', topic=news, timeframe=day"}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi người dùng hỏi tin tức/thời sự. general cho tra cứu thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Quy đổi mốc thời gian người dùng nêu: hôm nay/today → day, tuần này → week, tháng này → month, năm nay → year"}
        max_results: {type: integer, default: 5, description: "Số kết quả cần lấy"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung của MỘT URL cụ thể mà người dùng đã cung cấp."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ do người dùng đưa. Tuyệt đối không tự bịa URL; nếu người dùng nói 'bài này' mà không kèm link thì hỏi lại"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  # ISOLATED FOR THE BASE EVAL — commented out on purpose.
  # data/eval_base.json only expects: timeline, social_search, lookup, fetch, clarify.
  # Leaving send/policy/papers/paper_text declared lets the model mis-route base cases
  # to a bonus tool, which shows up as wrong_tool noise unrelated to core routing.
  #
  # RE-ENABLE (uncomment this whole block) BEFORE:
  #   python run_eval.py --provider gemini --version vX --suite extension \
  #     --eval-cases data/eval_research_extension.json
  # That suite expects policy / papers / paper_text; otherwise run_eval raises
  # "not declared in tools.yaml".
  #
  # - name: send
  #   description: "Gửi một đoạn văn bản đi."
  #   parameters:
  #     type: object
  #     properties:
  #       text: {type: string, default: "", description: "Nội dung"}
  #       confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
  #     required: [text]
  #
  # - name: policy
  #   description: "Tìm trong tài liệu nội bộ."
  #   parameters:
  #     type: object
  #     properties:
  #       query: {type: string, default: "", description: "Truy vấn"}
  #       policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
  #       top_k: {type: integer, default: 3, description: "Số mục"}
  #     required: [query]
  #
  # - name: papers
  #   description: "Tìm bài báo khoa học."
  #   parameters:
  #     type: object
  #     properties:
  #       query: {type: string, default: "", description: "Từ khóa"}
  #       max_results: {type: integer, default: 5, description: "Số lượng"}
  #       sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
  #     required: [query]
  #
  # - name: paper_text
  #   description: "Lấy nội dung text của một bài báo."
  #   parameters:
  #     type: object
  #     properties:
  #       arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
  #       max_pages: {type: integer, default: 5, description: "Số trang"}
  #       max_chars: {type: integer, default: 8000, description: "Số ký tự"}
