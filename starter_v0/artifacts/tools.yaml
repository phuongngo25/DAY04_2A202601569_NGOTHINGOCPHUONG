# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Gửi một câu hỏi cho người dùng khi thiếu thông tin cần thiết để hành động,
      hoặc khi cần xác nhận trước một hành động có tác động thật (ví dụ: gửi/đăng
      nội dung qua `send`).
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi cho người dùng"}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          description: >
            Bắt buộc chọn đúng loại câu hỏi:
            "yes_no" khi cần xác nhận có/không trước một hành động nhạy cảm/có
            tác động thật (ví dụ trước khi gọi `send`);
            "text" khi cần người dùng cung cấp thông tin còn thiếu ở dạng tự do
            (ví dụ: URL, tên tài khoản, nội dung);
            "choice" khi có sẵn danh sách lựa chọn cụ thể để người dùng chọn
            (dùng kèm `options`).
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn, chỉ dùng khi response_type là choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: >
      Tìm bài đăng trên một nền tảng mạng xã hội cụ thể (ví dụ Twitter/X).
      Chỉ dùng khi user hỏi rõ về bài đăng, ý kiến, phản ứng của mọi người
      trên một nền tảng mạng xã hội cụ thể được nêu tên. Nếu user không nhắc
      đến nền tảng mạng xã hội cụ thể, hoặc yêu cầu chuyển từ mạng xã hội
      sang tìm tin tức/web nói chung (ví dụ "bỏ Twitter, chuyển sang web"),
      dùng `lookup` thay vì tool này.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]


  - name: lookup
    description: >
      Tra cứu thông tin trên internet nói chung (web search / news search).
      Dùng khi user hỏi về tin tức, sự kiện, thông tin chung — không hỏi cụ thể
      về bài đăng/ý kiến trên một nền tảng mạng xã hội cụ thể (ví dụ Twitter/X).
      Nếu request nhắc "tin tức", "hôm nay có gì", hoặc user nói rõ muốn tìm
      trên web/news thay vì mạng xã hội, dùng tool này, không dùng
      `social_search`. Đặt topic="news" khi câu hỏi về tin tức/sự kiện gần
      đây; đặt timeframe khớp với mốc thời gian user nêu (ví dụ "hôm nay" ->
      "day"). Khi một multi-turn conversation đã xác lập topic hoặc timeframe
      ở lượt trước và lượt hiện tại chỉ đổi chủ đề tìm kiếm (query), vẫn giữ
      nguyên topic/timeframe đã xác lập trừ khi user nói rõ muốn đổi.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Gửi một đoạn văn bản đi (có tác động thật, ví dụ đăng lên kênh Telegram
      thật). KHÔNG được gọi tool này trực tiếp khi user mới yêu cầu đăng/gửi
      mà chưa xác nhận. Trước khi gọi `send`, luôn gọi `clarify` với
      response_type="yes_no" để xác nhận trước — bất kể nội dung cụ thể cần
      gửi đã có sẵn hay còn thiếu. Nếu nội dung còn thiếu, vẫn hỏi xác nhận
      yes_no trước; chỉ hỏi xin nội dung (response_type="text") ở lượt sau,
      sau khi user đã xác nhận đồng ý.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
